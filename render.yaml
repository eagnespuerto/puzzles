services:
  - type: web
    name: mobiletathampuzzles
    runtime: static
    staticPublishPath: ./public
    buildCommand: ""
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /puzzles-app/games/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /play
        destination: /puzzles-app/index.html
